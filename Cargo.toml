[package]
name = "foto-sin-rastro"
version = "0.1.0"
edition = "2024"
description = "Muestra y limpia los datos ocultos (ubicación, móvil, fecha) de tus fotos JPG y HEIC, sin salir de tu dispositivo"
license = "MIT"
readme = "README.md"
repository = "https://github.com/davidbc01/foto-sin-rastro"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
web = ["dep:wasm-bindgen"]

[dependencies]
anyhow = "1.0.104"
kamadak-exif = "0.6.2"
wasm-bindgen = { version = "0.2", optional = true }

[[bin]]
name = "sin-rastro"
path = "src/main.rs"

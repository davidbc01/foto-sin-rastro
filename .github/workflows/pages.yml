name: Publicar web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version de wasm-bindgen que usa el proyecto
        id: wb
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Recuperar wasm-bindgen de la cache
        id: cache-wb
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ steps.wb.outputs.version }}

      - name: Instalar wasm-bindgen
        if: steps.cache-wb.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ steps.wb.outputs.version }} --locked

      - name: Compilar Rust a WebAssembly
        run: cargo build --lib --target wasm32-unknown-unknown --release --features web

      - name: Generar el paquete para el navegador
        run: wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/foto_sin_rastro.wasm

      - name: Instalar dependencias de la web
        run: npm ci

      - name: Generar CSS e iconos
        run: npm run construir

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
